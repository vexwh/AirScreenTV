[versions]
agp = "9.4.1"
kotlin = "2.3.20"
ksp = "2.3.12"
hilt = "2.60.1"
composeBom = "2026.03.01"
tvMaterial = "1.1.0"
tvFoundation = "1.0.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
